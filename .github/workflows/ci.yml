# The spore's checks on each push to main and each pull request: formatting, clippy, the
# tests (the route tests on Postgres), the wasm build and the element's bundle. Hypha is a
# private git dependency: HYPHA_REPO_TOKEN is a fine-grained token that reads its contents.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  HYPHA_TEST_DATABASE_URL: postgres://hypha:hypha@localhost:5433/hypha

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hypha
          POSTGRES_PASSWORD: hypha
          POSTGRES_DB: hypha
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U hypha" --health-interval 2s --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Read Hypha with the token
        env:
          TOKEN: ${{ secrets.HYPHA_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::HYPHA_REPO_TOKEN isn't set: Hypha's repository can't be read"
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/hyphacommerce/hypha".insteadOf "https://github.com/hyphacommerce/hypha"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --lib --target wasm32-unknown-unknown

  element:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
